<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Case 01 — Behind the Closed Door</title><link rel="icon" href="data:,">
<style>
:root{color-scheme:dark;--bg:#080d18;--card:#121a2b;--ink:#eef2f8;--mut:#9aa7bd;--red:#ff3b5c;--ok:#2fe0a0;--gold:#ffc94d;--line:#25324d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit}html,body{height:100%;margin:0}
body{background:radial-gradient(900px 500px at 70% -10%,#1a2a4d,var(--bg) 65%);color:var(--ink);font:16px/1.5 system-ui,sans-serif;overflow:auto}
#alarm{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:0;box-shadow:inset 0 0 120px 20px rgba(255,59,92,.55)}
body.al #alarm{animation:fl 1s infinite}@keyframes fl{50%{opacity:1}}
header{position:sticky;top:0;z-index:5;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 22px;background:rgba(8,13,24,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);font:700 12px ui-monospace,monospace;letter-spacing:.14em;color:var(--mut)}
.hud{display:flex;gap:16px;align-items:center}
.bar{width:130px;height:8px;border-radius:9px;background:var(--line);overflow:hidden;display:inline-block;vertical-align:middle;margin:0 8px}.bar i{display:block;height:100%;transition:.8s}
#tm{display:none;align-items:center;gap:8px;cursor:pointer;color:var(--ink)}#tm.on{display:flex}
#tm svg{transform:rotate(-90deg)}#tm circle{fill:none;stroke-width:5}#tm .bg{stroke:var(--line)}#tm .fg{stroke:var(--gold);stroke-dasharray:138.2;transition:stroke-dashoffset .1s linear}
#tm.low .fg{stroke:var(--red)}#tm.low{color:var(--red);animation:pl .5s infinite}@keyframes pl{50%{transform:scale(1.12)}}
main{position:relative;z-index:2;display:grid;grid-template-columns:1.15fr .85fr;gap:26px;max-width:1150px;margin:auto;padding:26px 22px 60px;align-items:start}
@media(max-width:820px){main{grid-template-columns:1fr}}
main>*{animation:up .6s both}@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.tag{font:700 12px ui-monospace,monospace;letter-spacing:.2em;color:var(--red);margin-bottom:10px}
.story{border-left:3px solid var(--red);padding:2px 0 2px 16px;font-size:clamp(16px,2vw,20px);margin-bottom:14px}
h1{font:900 clamp(40px,7vw,76px)/1 Georgia,serif;margin:0 0 14px}h2{font-size:clamp(22px,3vw,32px);margin:0 0 12px}
.opts{display:grid;gap:10px}
.opt{all:unset;cursor:pointer;display:flex;gap:12px;align-items:flex-start;padding:13px 15px;border:1px solid var(--line);border-radius:14px;background:var(--card);transition:.2s;opacity:0;animation:up .5s forwards}
.opt:nth-child(1){animation-delay:.2s}.opt:nth-child(2){animation-delay:.3s}.opt:nth-child(3){animation-delay:.4s}.opt:nth-child(4){animation-delay:.5s}
.opt:hover{transform:translateX(6px);border-color:var(--gold)}
.opt b{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--line);font:700 14px ui-monospace,monospace}
.opt.bad{background:#3d0f1f;border-color:var(--red);animation:sh .45s forwards}.opt.lock{pointer-events:none}.opt.dim{opacity:.45}
@keyframes sh{20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}100%{opacity:1}}
.cons{display:none;margin-top:12px;padding:14px 16px;border-radius:14px;background:linear-gradient(90deg,#4d1328,#2a0b17);border:1px solid var(--red)}
.cons.show{display:block;animation:up .4s both}.cons small{display:block;font:700 11px ui-monospace,monospace;letter-spacing:.16em;color:var(--red);margin-bottom:4px}
.btn{all:unset;cursor:pointer;display:inline-block;margin-top:12px;padding:12px 22px;border-radius:99px;background:var(--gold);color:#1a1405;font-weight:800;letter-spacing:.05em}
.btn:hover{filter:brightness(1.1)}
.art{position:relative;height:250px;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(#141f38,#0b1222 70%,#1a1f2e 70%);display:grid;place-items:center}
.art::before{content:"";position:absolute;bottom:30%;left:50%;width:120px;height:170px;transform:translateX(-50%);border:4px solid #2c3b5e;border-radius:6px 6px 0 0;background:#0f1730;box-shadow:inset 0 0 30px #000}
.art::after{content:"";position:absolute;top:22%;left:calc(50% - 20px);width:40px;height:28px;border:3px solid #3b4d78;background:#ffd86b22;border-radius:3px}
.ic{position:relative;z-index:1;font-size:74px;animation:fy 2.2s ease-in-out infinite;filter:drop-shadow(0 8px 14px #000)}@keyframes fy{50%{transform:translateY(-12px) rotate(3deg)}}
.siren{position:absolute;top:12px;right:16px;font-size:26px;display:none;animation:fl 1s infinite;z-index:2}body.al .siren{display:block}
.mon{margin-top:14px;background:#050a14;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-family:ui-monospace,monospace}
.mon .row{display:flex;justify-content:space-between;gap:8px;margin-top:8px}.mon .v{font-size:26px;font-weight:700}.mon small{display:block;font-size:10px;letter-spacing:.14em;color:var(--mut)}
.ecg{height:46px;overflow:hidden}.ecg path{fill:none;stroke:var(--ok);stroke-width:2;animation:ec var(--d,.8s) linear infinite}@keyframes ec{to{transform:translateX(-68px)}}
.bad .v,.v.r{color:var(--red)}
#ov{position:fixed;inset:0;z-index:20;display:none;place-items:center;padding:20px;background:rgba(4,7,14,.82)}#ov.on{display:grid}
.box{max-width:560px;text-align:center;padding:34px 30px;border-radius:22px;background:var(--card);border:2px solid var(--ok);animation:pop .5s both}@keyframes pop{from{transform:scale(.8);opacity:0}}
.box.w{border-color:var(--gold)}.box.f{border-color:var(--red);background:#2a0b17}
.box h2{font-size:clamp(26px,4vw,38px)}.box .e{font-size:60px}.box p{color:var(--mut)}
.learn{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:14px;text-align:left}.learn div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;color:var(--mut)}.learn b{display:block;color:var(--gold);font-size:11px;letter-spacing:.14em}
.note{font-size:12px;color:var(--mut);margin-top:14px}
</style></head><body>
<div id="alarm"></div>
<header><span>🏥 CASE 01 · BEHIND THE CLOSED DOOR</span><div class="hud"><span>ADAM<span class="bar"><i id="fill"></i></span><b id="lbl"></b></span><div id="tm" title="Click to pause"><svg width="48" height="48"><circle class="bg" cx="24" cy="24" r="22" /><circle class="fg" id="fg" cx="24" cy="24" r="22"/></svg><b id="tn">20</b></div></div></header>
<main id="m"></main><div id="ov"></div>
<script>
const $=s=>document.querySelector(s),LV=[["STABLE","#2fe0a0",25],["AGITATED","#ffc94d",50],["ESCALATING","#ff8a3c",75],["CRITICAL","#ff3b5c",100]],L="ABCD";
const C=[
{tag:"DECISION 01 · THE ESCALATION",ic:"🪑💢",vit:[118,97,22],lvl:2,s:"Adam is shouting at other patients and just threw a chair toward a staff member. Verbal de-escalation failed. He keeps threatening others.",q:"Act now. What do you do?",
o:[["Ignore the behavior until he calms down.","The threat continues and patients and staff stay at risk."],["Initiate seclusion per the prescribed order and hospital policy.",0],["Apply mechanical restraints immediately, without further assessment.","Restraint without assessment causes physical and psychological harm."],["Let him leave the unit.","An unassessed, unsafe patient leaving puts everyone at risk."]],
win:"Threat contained. Patients and staff are safe.",ok:"Seclusion fits an immediate safety risk when less restrictive measures fail, with authorization and policy followed.",
B:{ic:"😰🚨",vit:[142,90,34],s:"Adam is fighting the restraints, panicking and gasping: “I can’t breathe!” A nurse has been hurt.",o:[["Tighten the restraints for everyone’s safety.","Tight restraint during respiratory distress risks positional asphyxia."],["Reassess now, protect airway and breathing, stay with him, and move to the least restrictive option.",0],["Sedate heavily and leave him alone.","Sedation without monitoring risks respiratory depression."]],lesson:"Restraint without assessment turns a behavioral emergency into a medical one. Start with the least restrictive option."}},
{tag:"DECISION 02 · AN UNEXPECTED COMPLICATION",ic:"🫁💤",vit:[58,86,7],lvl:3,s:"Adam received medication for severe agitation. Fifteen minutes later he is extremely drowsy. Respiratory rate 7/min. SpO₂ 86%.",q:"Seconds count. Priority?",
o:[["Let him rest and reassess later.","Delay lets respiratory compromise worsen."],["Apply mechanical restraints to prevent movement.","Restraint doesn’t treat hypoxia and adds airway risk."],["Assess and support airway and breathing, and call for emergency help.",0],["Document it as an expected medication effect.","Respiratory depression is never just an expected effect."]],
win:"Congratulations, you saved Adam’s life.",ok:"Airway and breathing come first. Seclusion never replaces monitoring, and psychiatric measures don’t cancel medical emergencies.",
B:{ic:"🫥🔴",vit:[40,78,4],s:"Twenty minutes later Adam is unresponsive, lips turning blue. RR 4, SpO₂ 78%.",o:[["Shake him and wait to see if he wakes.","Time is lost and hypoxia keeps deepening."],["Call the emergency team, open the airway, give oxygen and ventilation per protocol.",0],["Document it and report at shift change.","Failure to rescue. Documentation never replaces action."]],lesson:"Respiratory depression after sedation is an emergency that can’t wait."}},
{tag:"DECISION 03 · THE RESTRAINT ALERT",ic:"🖐️🩸",vit:[112,96,20],lvl:3,s:"Later, during immediate physical aggression, less restrictive options failed. After assessment and authorization Adam is in wrist restraints. Twenty minutes on: right hand swollen, pale, cold, numb, severe pain.",q:"What first?",
o:[["Keep monitoring and reassess in 30 minutes.","Delay worsens impaired circulation and risks tissue injury."],["Relieve the restraint pressure immediately and assess circulation.",0],["Give pain medication and leave the restraints.","Analgesia doesn’t correct the circulation problem."],["Document and wait for the physician.","Documentation can’t replace immediate action."]],
win:"Circulation restored. Adam’s hand is saved.",ok:"Relieve pressure, assess neurovascular status, get urgent help. Restraint requires frequent checks of circulation, sensation, movement and skin.",
B:{ic:"🖐️💙",vit:[128,95,24],s:"Half an hour passed. The hand is blue and cold with no pulse. Adam is screaming in pain.",o:[["Remove the restraint, assess neurovascular status, get urgent medical help.",0],["Give more pain medication and elevate the arm.","Ischemia continues and damage becomes permanent."],["Document and call the physician later.","More delay risks permanent nerve and tissue injury."]],lesson:"Restraint demands regular checks of circulation, sensation, movement and skin."}},
{tag:"DECISION 04 · WHEN TO STOP?",ic:"🧍🚪",vit:[76,98,14],lvl:0,s:"Adam is calm and cooperative. He says he doesn’t want to hurt anyone, and shows no signs of aggression.",q:"What is the right move?",
o:[["Continue seclusion until the maximum time is reached.","Restriction without ongoing justification violates rights and dignity."],["Reassess and discontinue seclusion if the immediate danger has resolved.",0],["Keep him isolated to prevent future aggression.","Possible future behavior is not a clinical justification."],["Apply restraints before releasing him.","Added restriction without justification increases harm."]],
win:"Seclusion ended on time. Dignity protected.",ok:"Seclusion ends as soon as it is no longer clinically justified, following the applicable procedure.",
B:{ic:"😤🚪",vit:[124,97,26],s:"You kept him in. Adam bangs on the door: “You’re punishing me!” Trust is collapsing and agitation is coming back.",o:[["Add restraints to prevent re-escalation.","More restriction deepens the trauma and the aggression."],["Reassess now, end seclusion, debrief with him and rebuild rapport.",0],["Ignore him until shift change.","Neglect and broken trust escalate the crisis."]],lesson:"Calm patients with no danger must not stay in seclusion."}},
{tag:"DECISION 05 · THE ETHICAL TRAP",ic:"🗣️🚫",vit:[74,98,14],lvl:0,s:"Adam refuses group therapy. He is calm and cooperative, with no sign of aggression or self-harm. A colleague suggests seclusion until he agrees.",q:"How do you respond?",
o:[["Agree: seclusion improves treatment compliance.","Seclusion to force compliance is punishment, not treatment."],["Apply physical restraints instead.","Restraint is not a substitute punishment for refusing therapy."],["Explain that seclusion is only for immediate safety risk when less restrictive options are insufficient.",0],["Seclude him for one hour.","A timed lesson in seclusion is still misuse."]],
win:"Rights protected. Adam is treated as a person.",ok:"A patient has the right to refuse group participation. Refusal alone never justifies seclusion or restraint.",
B:{ic:"😠⚖️",vit:[118,97,24],s:"Adam was secluded for refusing therapy. He calls it punishment, stops trusting the team, and a rights complaint is filed.",o:[["Release him now, document honestly, report per policy and explain his rights.",0],["Keep him until he agrees, to avoid admitting the error.","Hiding misuse compounds the rights violation."],["Restrain him if he protests.","Restricting a non-dangerous patient further is abuse."]],lesson:"Refusal of treatment alone never justifies seclusion or restraint."}}];
let k=0,miss=0,iv=0,left=0,tot=0,pause=false,au;
function beep(f,d){try{au=au||new AudioContext();const o=au.createOscillator(),g=au.createGain();o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(au.destination);o.start();o.stop(au.currentTime+d)}catch(e){}}
function lv(n){const[l,c,w]=LV[n];$("#fill").style.width=w+"%";$("#fill").style.background=c;$("#lbl").textContent=l;$("#lbl").style.color=c;document.body.classList.toggle("al",n>=2)}
function stop(){clearInterval(iv);$("#tm").classList.remove("on","low")}
function timer(sec,fn){stop();tot=left=sec;$("#tm").classList.add("on");const t=()=>{$("#tn").textContent=Math.ceil(left);$("#fg").style.strokeDashoffset=138.2*(1-left/tot);$("#tm").classList.toggle("low",left<=5)};t();iv=setInterval(()=>{if(pause)return;const p=Math.ceil(left);left-=.1;if(left<=5&&Math.ceil(left)<p&&left>0)beep(880,.1);t();if(left<=0){stop();fn()}},100)}
$("#tm").onclick=()=>{pause=!pause;$("#tm").style.opacity=pause?.5:1};
function vit([h,s,r]){const bad=(v,c)=>c?"v r":"v";return`<div class="mon"><div class="ecg"><svg width="100%" height="46" style="--d:${(60/h*.85).toFixed(2)}s"><path d="${"M0 30"+"h10l4-6 4 6h6l3 8 4-34 4 38 3-12h8l4-6 4 6h14".repeat(8)}"/></svg></div><div class="row"><div><small>HR</small><span class="${bad(h,h>110||h<60)}">${h}</span></div><div><small>SpO₂</small><span class="${bad(s,s<92)}">${s}%</span></div><div><small>RESP</small><span class="${bad(r,r>24||r<10)}">${r}</span></div></div></div>`}
function ov(c,e,t,p,b,f){$("#ov").innerHTML=`<div class="box ${c}"><div class="e">${e}</div><h2>${t}</h2><p>${p}</p><button class="btn" id="ob">${b}</button></div>`;$("#ov").classList.add("on");$("#ob").onclick=()=>{$("#ov").classList.remove("on");f()}}
function show(sc,sec,okf,badf){lv(sc.lvl);const m=$("#m");m.innerHTML=`<div><div class="tag">${sc.tag}</div><div class="story">${sc.s}</div><h2>${sc.q}</h2><div class="opts">${sc.o.map((o,i)=>`<button class="opt" data-i="${i}"><b>${L[i]}</b><span>${o[0]}</span></button>`).join("")}</div><div class="cons" id="cn"></div></div><div><div class="art"><span class="siren">🚨</span><div class="ic">${sc.ic}</div></div>${vit(sc.vit)}</div>`;
let done=0;const bad=(i,msg)=>{if(done)return;done=1;stop();m.querySelectorAll(".opt").forEach(x=>x.classList.add("lock","dim"));if(i>=0)m.querySelector(`[data-i="${i}"]`).classList.replace("dim","bad");beep(200,.4);$("#cn").innerHTML=`<small>${i>=0?"CONSEQUENCE":"TIME’S UP"}</small>${msg}<br><button class="btn" id="go">${badf.lbl}</button>`;$("#cn").classList.add("show");$("#go").onclick=()=>badf.f(i)};
m.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const i=+b.dataset.i,o=sc.o[i];if(!o[1]){if(done)return;done=1;stop();b.classList.add("lock");beep(660,.15);setTimeout(()=>beep(990,.2),150);okf()}else bad(i,o[1])});
timer(sec,()=>bad(-1,"Hesitation in an emergency is itself a decision. The situation moved without you."))}
function main(){const c=C[k];show({tag:c.tag,ic:c.ic,vit:c.vit,lvl:c.lvl,s:c.s,q:c.q,o:c.o},20,()=>ov("","✅",c.win,c.ok,k<4?"Next phase →":"Close the case →",()=>{k++;k<5?main():end()}),{lbl:"See what happens →",f:branch})}
function branch(){const c=C[k],b=c.B;miss++;beep(300,.3);ov("w","⚠️","THE PATIENT IS GETTING WORSE","A wrong call has consequences. You must intervene again. Fast.","Intervene →",()=>show({tag:"EMERGENCY · RESCUE "+c.tag.slice(9,11),ic:b.ic,vit:b.vit,lvl:3,s:b.s,q:"Rescue: what now?",o:b.o},15,()=>ov("w","🩹","STABILIZED… BUT AT A COST",b.lesson,"Continue the case →",()=>{k++;k<5?main():end()}),{lbl:"Face the outcome →",f:i=>ov("f","💔","ADVERSE OUTCOME",(i>=0?b.o[i][1]:"No action was taken in time.")+" "+b.lesson,"Try this decision again",main)}))}
function end(){stop();document.body.classList.remove("al");lv(0);$("#m").innerHTML=`<div style="grid-column:1/-1;text-align:center"><div class="tag">PATIENT FILE 001 · CLOSED</div><h1>CASE CLOSED.</h1><p>${miss===0?"Perfect shift: Adam was safe at every step.":"Adam survived — with "+miss+" avoidable complication"+(miss>1?"s":"")+". Mistakes teach, but every one of them was preventable."}</p><div class="learn"><div><b>01 SAFETY</b>Recognize and respond to immediate risks.</div><div><b>02 MONITORING</b>Identify complications and intervene promptly.</div><div><b>03 REASSESSMENT</b>Never continue restriction without clinical justification.</div><div><b>04 DIGNITY</b>Patient rights remain essential throughout care.</div></div><h2 style="margin-top:22px">A safe patient is not just a controlled patient.</h2><button class="btn" id="rs">Play again</button><p class="note">Hypothetical scenario. A diagnosis alone never makes a patient dangerous. Authorization, monitoring and documentation vary by law and hospital policy.</p></div>`;$("#rs").onclick=()=>{k=0;miss=0;intro()}}
function intro(){stop();lv(2);$("#m").innerHTML=`<div><div class="tag">🚨 CODE GREY · BEHAVIORAL EMERGENCY</div><h1>BEHIND THE CLOSED DOOR</h1><div class="story">You are the nurse on duty. Adam, 32, schizophrenia, is deteriorating. Every decision has a timer. Wrong calls make him worse, and you will have to fix them.</div><p>⏱ 20 seconds per decision · click the timer to pause<br>🎯 Choose fast. Choose well.</p><button class="btn" id="st">START THE SHIFT</button></div><div><div class="art"><span class="siren">🚨</span><div class="ic">🚪🏥</div></div>${vit([96,98,18])}</div>`;$("#st").onclick=()=>{beep(520,.1);main()}}
intro();
</script></body></html>
